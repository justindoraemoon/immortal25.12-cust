name: Build ImmortalWrt 25.12 5-NIC Custom

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Space cleanup & Environment Setup
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get update
          sudo apt-get install -y binfmt-support qemu-user-static xz-utils zstd git

      - name: Download Official ImageBuilder
        run: |
          wget https://downloads.immortalwrt.org/releases/25.12.0/targets/x86/64/immortalwrt-imagebuilder-25.12.0-x86-64.Linux-x86_64.tar.zst
          tar -I zstd -xf immortalwrt-imagebuilder-*.tar.zst
          mv immortalwrt-imagebuilder-25.12.0-x86-64.Linux-x86_64 ib && cd ib

      - name: Download OpenClash Separately
        run: |
          cd ib
          # 建立一个本地临时本地包目录
          mkdir -p my_packages
          # 仅单独下载 OpenClash，因为它是唯一官方源里没有的刚需插件
          wget -P my_packages/ https://github.com/vernesong/OpenClash/releases/download/v0.46.06-beta/luci-app-openclash_0.46.06-beta_all.apk || true

      - name: Inject 5-NIC Network Settings & Default IP
        run: |
          cd ib
          mkdir -p files/etc/uci-defaults
          
          # 创建首次开机自动初始化脚本
          cat << 'EOF' > files/etc/uci-defaults/99-custom-settings
          #!/bin/sh
          
          # 1. 设置 LAN 口 IP 为 192.168.5.1
          uci set network.lan.ipaddr='192.168.5.1'
          
          # 2. 完美适配你的物理网口需求：
          # 将 eth0 (ESXi管理共用口), eth1, eth2, eth3 全部桥接到 LAN
          uci set network.lan.ports='eth0 eth1 eth2 eth3'
          
          # 将 eth4 独立设置为外部 WAN 口
          uci set network.wan.device='eth4'
          
          uci commit network
          exit 0
          EOF
          chmod +x files/etc/uci-defaults/99-custom-settings

      - name: Compile Custom VMDK Image
        run: |
          cd ib
          # 关键修正：
          # 1. MosDNS (luci-app-mosdns) 直接走官方源，不通过本地注入，100% 解决依赖冲突
          # 2. 通过在 PACKAGES 列表里加入“./my_packages/*.apk”来本地安装 OpenClash
          # 3. 25.12 的 ImageBuilder 传递参数中，通过底层指令绕过第三方包的签名限制
          make image PROFILE="generic" FILES="files" \
            PACKAGES="luci-app-mosdns luci-app-ttyd kmod-ipt-offload iptables-mod-tproxy curl ca-bundle ca-certificates kmod-fs-ext4 kmod-util-losetup ./my_packages/luci-app-openclash_0.46.06-beta_all.apk"

      - name: Upload Firmware to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ImmortalWrt_25.12_5NIC_192.168.5.1
          path: ib/bin/targets/x86/64/*combined-efi.vmdk
